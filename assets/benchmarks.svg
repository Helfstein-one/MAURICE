<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 440" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-bm" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e1b4b"/>
    </linearGradient>
  </defs>

  <rect width="920" height="440" fill="url(#bg-bm)" rx="12"/>

  <!-- Header -->
  <text x="460" y="38" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="700" fill="#f8fafc" text-anchor="middle">
    MAURICE Benchmark Evaluation &amp; Inference Throughput
  </text>
  <text x="460" y="58" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#94a3b8" text-anchor="middle">
    Performance Metrics &amp; Accuracy Scores Across Model Variants
  </text>

  <!-- Section 1: Throughput Chart (t/s) -->
  <g transform="translate(50, 90)">
    <rect width="390" height="310" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
    <text x="20" y="30" font-family="sans-serif" font-size="15" font-weight="700" fill="#38bdf8">Inference Speed (tokens/sec)</text>

    <!-- Bar AVX-512 -->
    <text x="20" y="70" font-family="sans-serif" font-size="12" fill="#cbd5e1">x86_64 CPU (AVX-512)</text>
    <rect x="20" y="80" width="280" height="22" rx="4" fill="#0284c7"/>
    <text x="310" y="96" font-family="sans-serif" font-size="12" font-weight="700" fill="#38bdf8">112 t/s</text>

    <!-- Bar Apple MPS -->
    <text x="20" y="130" font-family="sans-serif" font-size="12" fill="#cbd5e1">Apple Silicon Metal (MPS)</text>
    <rect x="20" y="140" width="310" height="22" rx="4" fill="#0d9488"/>
    <text x="340" y="156" font-family="sans-serif" font-size="12" font-weight="700" fill="#2dd4bf">124 t/s</text>

    <!-- Bar AVX2 -->
    <text x="20" y="190" font-family="sans-serif" font-size="12" fill="#cbd5e1">x86_64 CPU (AVX2)</text>
    <rect x="20" y="200" width="210" height="22" rx="4" fill="#6366f1"/>
    <text x="240" y="216" font-family="sans-serif" font-size="12" font-weight="700" fill="#818cf8">84.5 t/s</text>

    <!-- Latency metric -->
    <rect x="20" y="245" width="350" height="45" rx="6" fill="#0f172a" stroke="#475569" stroke-width="1"/>
    <text x="30" y="265" font-family="sans-serif" font-size="12" fill="#94a3b8">Avg Time To First Token (TTFT):</text>
    <text x="30" y="282" font-family="sans-serif" font-size="13" font-weight="700" fill="#f43f5e">18.2 ms (Sub-20ms instant response)</text>
  </g>

  <!-- Section 2: Domain Evaluation Scores -->
  <g transform="translate(480, 90)">
    <rect width="390" height="310" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
    <text x="20" y="30" font-family="sans-serif" font-size="15" font-weight="700" fill="#a855f7">Domain Benchmark Pass Rates</text>

    <!-- Variant C -->
    <g transform="translate(20, 50)">
      <rect width="350" height="70" rx="6" fill="#0f172a" stroke="#3b82f6" stroke-width="1"/>
      <text x="12" y="22" font-family="sans-serif" font-size="13" font-weight="700" fill="#60a5fa">mau-llm-1.0-c (Code)</text>
      <text x="12" y="42" font-family="sans-serif" font-size="11" fill="#cbd5e1">HumanEval Pass@1: <tspan fill="#4ade80" font-weight="700">76.4%</tspan> | AST Pass: <tspan fill="#4ade80" font-weight="700">98.2%</tspan></text>
      <text x="12" y="58" font-family="sans-serif" font-size="11" fill="#cbd5e1">Unified Diff Patch Accuracy: <tspan fill="#4ade80" font-weight="700">94.5%</tspan></text>
    </g>

    <!-- Variant R -->
    <g transform="translate(20, 130)">
      <rect width="350" height="70" rx="6" fill="#0f172a" stroke="#a855f7" stroke-width="1"/>
      <text x="12" y="22" font-family="sans-serif" font-size="13" font-weight="700" fill="#c084fc">mau-llm-1.0-r (Reasoning)</text>
      <text x="12" y="42" font-family="sans-serif" font-size="11" fill="#cbd5e1">GSM8k Math Score: <tspan fill="#4ade80" font-weight="700">88.4%</tspan> | MATH Pass: <tspan fill="#4ade80" font-weight="700">62.1%</tspan></text>
      <text x="12" y="58" font-family="sans-serif" font-size="11" fill="#cbd5e1">&lt;think&gt; CoT Tag Calibration: <tspan fill="#4ade80" font-weight="700">99.8%</tspan></text>
    </g>

    <!-- Variant G -->
    <g transform="translate(20, 210)">
      <rect width="350" height="70" rx="6" fill="#0f172a" stroke="#10b981" stroke-width="1"/>
      <text x="12" y="22" font-family="sans-serif" font-size="13" font-weight="700" fill="#34d399">mau-llm-1.0-g (General)</text>
      <text x="12" y="42" font-family="sans-serif" font-size="11" fill="#cbd5e1">MT-Bench Score: <tspan fill="#4ade80" font-weight="700">8.72 / 10</tspan></text>
      <text x="12" y="58" font-family="sans-serif" font-size="11" fill="#cbd5e1">Adaptive Thinking Suppression: <tspan fill="#4ade80" font-weight="700">96.5%</tspan></text>
    </g>
  </g>
</svg>
