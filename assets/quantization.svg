<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" width="100%" height="100%">
  <defs>
    <linearGradient id="bg2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="box-f16" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#312e81"/>
    </linearGradient>
    <linearGradient id="box-calib" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#701a75"/>
      <stop offset="100%" stop-color="#831843"/>
    </linearGradient>
    <linearGradient id="box-imatrix" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#854d0e"/>
      <stop offset="100%" stop-color="#713f12"/>
    </linearGradient>
    <linearGradient id="box-q4" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#065f46"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>
    <marker id="arrow2" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#f59e0b"/>
    </marker>
  </defs>

  <rect width="900" height="420" fill="url(#bg2)" rx="12"/>

  <!-- Title -->
  <text x="450" y="40" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="700" fill="#f9fafb" text-anchor="middle">
    GGUF Importance Matrix (imatrix) Calibration Flow
  </text>
  <text x="450" y="62" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#9ca3af" text-anchor="middle">
    Preserving 1.5B Parameter Model Precision via Domain-Specific Activation Weighting
  </text>

  <!-- Step A: Unquantized FP16 Model -->
  <g transform="translate(50, 100)">
    <rect width="220" height="110" rx="8" fill="url(#box-f16)" stroke="#6366f1" stroke-width="1.5"/>
    <text x="16" y="32" font-family="sans-serif" font-size="14" font-weight="700" fill="#a5b4fc">Merged Model</text>
    <text x="16" y="55" font-family="sans-serif" font-size="12" fill="#e0e7ff">F16 GGUF Weights</text>
    <text x="16" y="75" font-family="sans-serif" font-size="11" fill="#c7d2fe">3.1 GB Footprint</text>
    <text x="16" y="93" font-family="sans-serif" font-size="11" fill="#c7d2fe">Full Floating Point</text>
  </g>

  <!-- Step B: Calibration Data -->
  <g transform="translate(50, 250)">
    <rect width="220" height="110" rx="8" fill="url(#box-calib)" stroke="#ec4899" stroke-width="1.5"/>
    <text x="16" y="32" font-family="sans-serif" font-size="14" font-weight="700" fill="#fbcfe8">Domain Calibration</text>
    <text x="16" y="55" font-family="sans-serif" font-size="12" fill="#fce7f3">imatrix_*.txt Data</text>
    <text x="16" y="75" font-family="sans-serif" font-size="11" fill="#fbcfe8">• Code AST / Diffs (Variant C)</text>
    <text x="16" y="93" font-family="sans-serif" font-size="11" fill="#fbcfe8">• CoT Proofs (Variant R)</text>
  </g>

  <!-- Arrows into llama-imatrix -->
  <path d="M 270 155 L 340 190" stroke="#f59e0b" stroke-width="2" marker-end="url(#arrow2)"/>
  <path d="M 270 305 L 340 230" stroke="#f59e0b" stroke-width="2" marker-end="url(#arrow2)"/>

  <!-- Step C: llama-imatrix Computation -->
  <g transform="translate(350, 155)">
    <rect width="210" height="110" rx="8" fill="url(#box-imatrix)" stroke="#eab308" stroke-width="1.5"/>
    <text x="16" y="32" font-family="sans-serif" font-size="14" font-weight="700" fill="#fef08a">llama-imatrix</text>
    <text x="16" y="55" font-family="sans-serif" font-size="12" fill="#fef9c3">Activation Frequency</text>
    <text x="16" y="75" font-family="sans-serif" font-size="11" fill="#fef08a">Computes Importance Dat</text>
    <text x="16" y="93" font-family="sans-serif" font-size="11" fill="#fef08a">build/imatrix_*.dat</text>
  </g>

  <!-- Arrow C -> D -->
  <path d="M 560 210 L 620 210" stroke="#f59e0b" stroke-width="2.5" marker-end="url(#arrow2)"/>

  <!-- Step D: llama-quantize Q4_K_M -->
  <g transform="translate(630, 155)">
    <rect width="220" height="110" rx="8" fill="url(#box-q4)" stroke="#10b981" stroke-width="1.5"/>
    <text x="16" y="32" font-family="sans-serif" font-size="14" font-weight="700" fill="#6ee7b7">llama-quantize</text>
    <text x="16" y="55" font-family="sans-serif" font-size="12" fill="#a7f3d0">Quant Target: Q4_K_M</text>
    <text x="16" y="75" font-family="sans-serif" font-size="11" fill="#6ee7b7">Size: ~1.1 GB (&lt;35% F16)</text>
    <text x="16" y="93" font-family="sans-serif" font-size="11" fill="#6ee7b7">Perplexity Loss &lt; 0.08</text>
  </g>
</svg>
