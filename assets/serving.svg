<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-srv" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#020617"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="ui-card" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <marker id="arrow-srv" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#38bdf8"/>
    </marker>
  </defs>

  <rect width="920" height="400" fill="url(#bg-srv)" rx="12"/>

  <!-- Title -->
  <text x="460" y="38" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="700" fill="#f8fafc" text-anchor="middle">
    Serving Backend &amp; Interactive Streamlit CoT UI Flow
  </text>
  <text x="460" y="58" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#94a3b8" text-anchor="middle">
    OpenAI-Compatible REST Endpoint + Chain-of-Thought Stream Parsing
  </text>

  <!-- User Client -->
  <g transform="translate(40, 100)">
    <rect width="180" height="240" rx="10" fill="url(#ui-card)" stroke="#38bdf8" stroke-width="1.5"/>
    <text x="90" y="32" font-family="sans-serif" font-size="14" font-weight="700" fill="#38bdf8" text-anchor="middle">User Client</text>
    <text x="90" y="55" font-family="sans-serif" font-size="12" fill="#94a3b8" text-anchor="middle">Browser / cURL</text>

    <rect x="15" y="80" width="150" height="135" rx="6" fill="#020617" stroke="#1e293b"/>
    <text x="25" y="102" font-family="monospace" font-size="11" fill="#a5f3fc">POST /v1/chat</text>
    <text x="25" y="122" font-family="monospace" font-size="10" fill="#94a3b8">{ "model":</text>
    <text x="35" y="138" font-family="monospace" font-size="10" fill="#f43f5e">"mau-llm-1.0-r"</text>
    <text x="25" y="154" font-family="monospace" font-size="10" fill="#94a3b8">  "messages": [...]</text>
    <text x="25" y="170" font-family="monospace" font-size="10" fill="#94a3b8">  "temperature": 0.2</text>
    <text x="25" y="186" font-family="monospace" font-size="10" fill="#94a3b8">}</text>
  </g>

  <!-- Arrow Client -> FastAPI -->
  <path d="M 220 220 L 290 220" stroke="#38bdf8" stroke-width="2.5" marker-end="url(#arrow-srv)"/>

  <!-- FastAPI Server -->
  <g transform="translate(300, 100)">
    <rect width="210" height="240" rx="10" fill="url(#ui-card)" stroke="#a855f7" stroke-width="1.5"/>
    <text x="105" y="32" font-family="sans-serif" font-size="14" font-weight="700" fill="#c084fc" text-anchor="middle">FastAPI Backend</text>
    <text x="105" y="55" font-family="sans-serif" font-size="12" fill="#94a3b8" text-anchor="middle">scripts/06_serve_model.py</text>

    <rect x="15" y="80" width="180" height="135" rx="6" fill="#020617" stroke="#1e293b"/>
    <text x="25" y="105" font-family="sans-serif" font-size="11" fill="#e9d5ff">• OpenAI Compatible API</text>
    <text x="25" y="130" font-family="sans-serif" font-size="11" fill="#e9d5ff">• Dynamic Model Selection</text>
    <text x="25" y="155" font-family="sans-serif" font-size="11" fill="#e9d5ff">• GGUF / PyTorch Engine</text>
    <text x="25" y="180" font-family="sans-serif" font-size="11" fill="#e9d5ff">• Streaming Response</text>
  </g>

  <!-- Arrow FastAPI -> Streamlit UI -->
  <path d="M 510 220 L 580 220" stroke="#38bdf8" stroke-width="2.5" marker-end="url(#arrow-srv)"/>

  <!-- Streamlit UI -->
  <g transform="translate(590, 100)">
    <rect width="290" height="240" rx="10" fill="url(#ui-card)" stroke="#10b981" stroke-width="1.5"/>
    <text x="145" y="32" font-family="sans-serif" font-size="14" font-weight="700" fill="#34d399" text-anchor="middle">Streamlit CoT UI</text>
    <text x="145" y="55" font-family="sans-serif" font-size="12" fill="#94a3b8" text-anchor="middle">ui/app.py Visualizer</text>

    <!-- Visual Box inside Streamlit UI -->
    <rect x="15" y="75" width="260" height="145" rx="6" fill="#020617" stroke="#334155"/>
    <rect x="25" y="85" width="240" height="60" rx="4" fill="#1e1b4b" stroke="#6366f1" stroke-width="1"/>
    <text x="35" y="102" font-family="sans-serif" font-size="10" font-weight="700" fill="#818cf8">🧠 &lt;think&gt; Reasoning Process</text>
    <text x="35" y="118" font-family="sans-serif" font-size="10" fill="#c7d2fe">Evaluating critical points of function...</text>
    <text x="35" y="132" font-family="sans-serif" font-size="10" fill="#c7d2fe">f'(x) = 3x^2 - 3 = 0 =&gt; x = ±1</text>

    <rect x="25" y="152" width="240" height="55" rx="4" fill="#064e3b" stroke="#10b981" stroke-width="1"/>
    <text x="35" y="170" font-family="sans-serif" font-size="10" font-weight="700" fill="#6ee7b7">💬 Final Answer</text>
    <text x="35" y="188" font-family="sans-serif" font-size="10" fill="#a7f3d0">The local minimum occurs at x = 1.</text>
  </g>
</svg>
