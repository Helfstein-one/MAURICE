[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
name = "maurice"
version = "1.0.0"
description = "Minimal Adaptation for Ultra-fast Reasoning and Inference in Code Engines"
authors = ["Maurício Helfstein Gonçalves"]
readme = "README.md"

[tool.poetry.dependencies]
python = "^3.10"
torch = ">=2.0.0"
transformers = ">=4.38.0"
datasets = ">=2.18.0"
peft = ">=0.10.0"
trl = ">=0.8.0"
bitsandbytes = ">=0.43.0"
psutil = ">=5.9.0"
accelerate = ">=0.27.0"
unsloth = ">=2024.1"

[tool.poetry.group.dev.dependencies]
pytest = ">=8.0"
ruff = ">=0.4.0"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
