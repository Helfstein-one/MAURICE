[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
name = "maurice"
version = "1.0.0"
description = "Minimal Adaptation for Ultra-fast Reasoning and Inference in Code Engines"
authors = ["Maurício Helfstein Gonçalves"]
readme = "README.md"

[tool.poetry.dependencies]
fastapi = "^0.100.0"
uvicorn = "^0.23.0"
sse-starlette = "^1.6.5"
pydantic = "^2.0.0"
python = "^3.10"
torch = ">=2.0.0"
transformers = ">=4.38.0"
datasets = ">=2.16.0"
trl = ">=0.7.10"
peft = ">=0.8.0"
accelerate = ">=0.26.0"
bitsandbytes = ">=0.42.0"
unsloth = ">=2024.1"
psutil = ">=5.9.0"

[tool.poetry.group.dev.dependencies]
pytest = ">=7.0.0"
pytest-cov = ">=4.0.0"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
