[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
name = "maurice"
version = "1.0.0"
description = "Minimal Adaptation for Ultra-fast Reasoning and Inference in Code Engines"
authors = ["Maurício Helfstein Gonçalves"]
readme = "README.md"
package-mode = false

[tool.poetry.dependencies]
python = "^3.10"
torch = ">=2.0.0"
transformers = ">=4.38.0"
datasets = ">=2.16.0"
trl = ">=0.7.10"
peft = ">=0.8.0"
accelerate = ">=0.26.0"
bitsandbytes = ">=0.42.0"
unsloth = ">=2024.1"
psutil = ">=5.9.0"

[tool.poetry.dev-dependencies]
pytest = ">=7.0.0"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
