name: 02 - Podman Build & Binary Validation

on:
  workflow_run:
    workflows: ["01 - Code Quality & Fast Tests"]
    types: [completed]
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  podman-check:
    name: Podman Build & CLI Execution
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Podman
        run: |
          sudo apt-get update
          sudo apt-get install -y podman
      - name: Build Containerfile
        run: podman build -t maurice:latest -f Containerfile .
      - name: Verify Binary Execution (llama-cli)
        run: podman run --rm maurice:latest llama-cli --help
