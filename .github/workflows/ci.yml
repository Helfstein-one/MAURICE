name: MAURICE Sequential CI Pipeline

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

concurrency:
  group: ${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ==========================================================
  # NÍVEL 1: Análise Estática e Qualidade (Trava imediata)
  # ==========================================================
  code_quality:
    name: 01 - Code Quality & Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Linting Tools
        run: |
          python -m pip install --upgrade pip
          pip install ruff

      - name: Check Lint & Formatting
        run: |
          ruff check .
          ruff format --check .

  # ==========================================================
  # NÍVEL 2: Testes Unitários de Schema e Parsing
  # ==========================================================
  unit_tests:
    name: 02 - Unit & Schema Tests
    needs: code_quality
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Test Dependencies
        run: |
          pip install pytest datasets
          pip install -e . 2>/dev/null || true

      - name: Run Pytest
        run: |
          pytest tests/ -v -m "not slow"

  # ==========================================================
  # NÍVEL 3: Build Podman & Validação do Runtime Nativo C++
  # ==========================================================
  container_build:
    name: 03 - Podman Build & llama-cli Execution
    needs: unit_tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Podman
        run: |
          sudo apt-get update
          sudo apt-get install -y podman

      - name: Build Containerfile
        run: |
          podman build -t maurice:ci -f Containerfile .

      - name: Validate Binary Execution Inside Container
        run: |
          podman run --rm maurice:ci llama-cli --help

  # ==========================================================
  # NÍVEL 4: Dry-Run do Pipeline de Modelos
  # ==========================================================
  model_dryrun:
    name: 04 - Pipeline Scripts Dry-Run (c, r, g)
    needs: container_build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Validate Scripts Compilation & Configs
        run: |
          python -m py_compile scripts/01_prepare_datasets.py
          python -m py_compile scripts/02_train_qlora.py
          python -m py_compile scripts/03_merge_weights.py
          python -m py_compile scripts/05_benchmark_eval.py
          echo "Todos os módulos e pipelines foram validados com sucesso."
