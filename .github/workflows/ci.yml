name: MAURICE Tree-Structured CI Pipeline

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ==========================================================
  # RAIZ: Quality Gate & Linting (Fail-Fast)
  # ==========================================================
  code_quality:
    name: 01 - Code Quality & Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Linting Tools
        run: |
          python -m pip install --upgrade pip
          pip install ruff

      - name: Check Lint & Formatting
        run: |
          ruff check .
          ruff format --check .

  # ==========================================================
  # RAMO ESQUERDO: Testes Unitários de Schema e Parsing
  # ==========================================================
  unit_tests:
    name: 02A - Unit & Schema Tests
    needs: code_quality
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Test Dependencies
        run: |
          pip install pytest datasets pydantic
          pip install -e . 2>/dev/null || true

      - name: Run Pytest
        run: |
          pytest tests/ -v -m "not slow"

  # ==========================================================
  # RAMO DIREITO: Build Nativo Podman / llama.cpp (Paralelo a 02A)
  # ==========================================================
  container_build:
    name: 02B - Podman & Native C++ Build
    needs: code_quality
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Podman
        run: |
          sudo apt-get update
          sudo apt-get install -y podman

      - name: Build Containerfile
        run: |
          podman build -t maurice:ci -f Containerfile .

      - name: Validate Binary Execution Inside Container
        run: |
          podman run --rm maurice:ci llama-cli --help

  # ==========================================================
  # RAMIFICAÇÃO (FAN-OUT): Validação Isolada por Variante de Modelo
  # Depende tanto dos testes de unidade quanto do container compilado
  # ==========================================================
  model_validation_matrix:
    name: 03 - Validate Variant (${{ matrix.variant }})
    needs: [unit_tests, container_build]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        variant: [c, r, g]
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Validate Core Pipeline Scripts
        run: |
          python -m py_compile scripts/01_prepare_datasets.py
          python -m py_compile scripts/02_train_qlora.py
          python -m py_compile scripts/03_merge_weights.py
          python -m py_compile scripts/05_benchmark_eval.py

      - name: Dry-Run Specific Variant Config
        run: |
          echo "Validando configuração específica da variante: mau-llm-1.0-${{ matrix.variant }}"
          if [ -f "configs/variant_${{ matrix.variant }}.json" ]; then
            python -c "import json; json.load(open('configs/variant_${{ matrix.variant }}.json'))"
            echo "Config variant_${{ matrix.variant }}.json validada com sucesso."
          else
            echo "Aviso: configs/variant_${{ matrix.variant }}.json ainda não criado (ok em dry-run inicial)."
          fi

  # ==========================================================
  # CONVERGÊNCIA (JOIN): Pipeline Gate de Sucesso Geral
  # ==========================================================
  pipeline_success:
    name: 04 - Pipeline Gate (Tree Complete)
    needs: [model_validation_matrix]
    runs-on: ubuntu-latest
    steps:
      - name: Pipeline Complete
        run: |
          echo "=========================================================="
          echo "Todos os ramos da árvore foram validados com sucesso!"
          echo "- Lint & Estilo: OK"
          echo "- Testes Unitários: OK"
          echo "- Compilação Nativa llama.cpp / Podman: OK"
          echo "- Variantes (c, r, g): OK"
          echo "=========================================================="
