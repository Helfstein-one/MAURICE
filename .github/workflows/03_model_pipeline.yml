name: 03 - Model Execution Pipeline

on:
  workflow_dispatch:
    inputs:
      variant:
        description: 'Modelo a executar'
        required: true
        default: 'c'
        type: choice
        options:
          - c
          - r
          - g
          - all

jobs:
  run-pipeline:
    name: Run Dry-Run Dataset & Inference
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Test Harness
        run: |
          pip install pytest
      - name: Dry-Run Pipeline Validation
        run: |
          echo "Validando pipeline para a variante: ${{ github.event.inputs.variant }}"
          python -m py_compile scripts/01_prepare_datasets.py || true
          python -m py_compile scripts/02_train_qlora.py || true
