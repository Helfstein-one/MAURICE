name: Pipeline Dry Run

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  dry-run:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.10"
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install poetry
        poetry install
        
    - name: Run 01 Prepare Datasets (Dry Run)
      run: |
        poetry run python scripts/01_prepare_datasets.py --dry-run
        
    - name: Run 02 Train QLoRA (Dry Run)
      run: |
        poetry run python scripts/02_train_qlora.py --dry-run
        
    - name: Run 03 Merge Weights (Dry Run)
      run: |
        poetry run python scripts/03_merge_weights.py --dry-run
        
    - name: Run 05 Benchmark Eval (Dry Run)
      run: |
        poetry run python scripts/05_benchmark_eval.py --dry-run
